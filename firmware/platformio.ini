[platformio]
default_envs = usb
; optional, git-ignored: overrides the [ota] section below
extra_configs = secrets.ini

[ota]
host = deskbuddy.local
password = deskbuddy

[env]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
; two app slots so the firmware can update itself over Wi-Fi
board_build.partitions = min_spiffs.csv
board_build.flash_mode = dio
monitor_speed = 115200
build_flags =
    -O2
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    lvgl/lvgl@8.3.11
    lovyan03/LovyanGFX@1.1.16
    bblanchon/ArduinoJson@7.2.1

; flash over USB (first install)
[env:usb]
upload_speed = 921600

; flash over Wi-Fi: pio run -e ota -t upload
[env:ota]
upload_protocol = custom
upload_command = python ../tools/ota_upload.py ${ota.host} ${ota.password} $SOURCE
